{% load static %}
<link rel="stylesheet" href="{% static 'vendors/css/vendor_orders.css' %}">

<h2>My Orders</h2>

<table>
    <tr>
        <th>Order ID</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Date</th>
    </tr>

    {% for item in orders %}
    <tr>
        <td>{{ item.order.id }}</td>
        <td>{{ item.product.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.order.created_at }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No orders found</td>
    </tr>
    {% endfor %}
</table>

{% extends "core/base.html" %}
{% load static %}

{% block content %}

<div class="auth-container">
    <div class="auth-form">
        <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="password2" required>
        </div>

        <div class="form-group">
            <label>Choose Role</label>
            <select name="role" id="role" onchange="toggleShopField()">
                <option value="customer">Customer</option>
                <option value="vendor">Vendor</option>
            </select>
        </div>

        <div id="shopField" class="form-group" style="display:none; opacity:0; transition:0.3s;">
            <label>Shop Name</label>
            <input type="text" name="shop_name">
        </div>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Already have an account?
        <a href="{% url 'login' %}" style="color:#00bfff;">Login</a>
    </p>
</div>

</div>

<script>
function toggleShopField() {
    let role = document.getElementById("role").value;
    let shopField = document.getElementById("shopField");

    if (role === "vendor") {
        shopField.style.display = "block";
        setTimeout(() => {
            shopField.style.opacity = "1";
        }, 10);
    } else {
        shopField.style.opacity = "0";
        setTimeout(() => {
            shopField.style.display = "none";
        }, 200);
    }
}

// run on page load
window.onload = toggleShopField;
</script>

{% endblock %}

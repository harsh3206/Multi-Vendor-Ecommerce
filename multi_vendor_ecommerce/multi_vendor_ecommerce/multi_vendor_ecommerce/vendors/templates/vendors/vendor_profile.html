
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'vendors/css/vendor_profile.css' %}">

<div class="profile-container">
    <div class="dashboard-card">

        <h2>Welcome, {{ request.user.username }}</h2>

        <h4>Email: {{ request.user.email }}</h4>

        {% if request.user.vendor %}
            <h4>Shop Name: {{ request.user.vendor.shop_name }}</h4>
        {% endif %}

        <h5>Total Products</h5>

        <div class="button-group">
            <a href="{% url 'vendor_dashboard' %}" class="btn-primary">Dashboard</a>
            <a href="{% url 'add_products' %}" class="btn-secondary">Add Product</a>
        </div>

    </div>
</div>
{% endblock %}

{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'orders/css/order_success.css' %}">

<div class="success-container">

    <div class="success-card">
        <h2 class="success-title">🎉 Order Placed Successfully</h2>

        <p class="order-id">Order ID: <b>#{{ order.id }}</b></p>
        <p class="order-total">Total Paid: ₹{{ order.total_amount }}</p>

        <a href="{% url 'order_list' %}" class="btn-orders">
            View My Orders
        </a>
    </div>

</div>

{% endblock %}

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Multi Vendor</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <div class="logo">
            <a href="/">Multi Vendor Commerce</a>
        </div>

        <form method="GET" action="{% url 'core:search_products' %}" class="search-form">
            <input type="text" name="q" placeholder="Search products..." value="{{ query }}">
            <button type="submit">Search</button>
        </form>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products/">Products</a>
            <a href="/cart/">Cart</a>

            {% if user.is_authenticated %}
                <a href="/orders/order_list/">Orders</a>
                <span>Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}" class="btn">Signup</a>
            {% endif %}
        </div>

    </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
